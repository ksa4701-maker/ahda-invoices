<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#44546A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Custody">
<title>Custody Invoices</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
:root{--hd:#44546A;--band:#8EA9DB;--band2:#9BC2E6;--green:#C6E0B4;--gray:#D9D9D9;--bg:#f3f5f8;--card:#fff;--tx:#1d232b;--mut:#6b7380;--line:#dfe3ea;--ok:#2e7d32;--warn:#b26a00;--bad:#c62828;--acc:#2f5597}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
.hidden{display:none!important}
header.top{position:sticky;top:0;z-index:5;background:var(--hd);color:#fff;padding:calc(env(safe-area-inset-top) + 10px) 14px 10px;display:flex;align-items:center;gap:10px}
header.top h1{font-size:17px;font-weight:600;margin:0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.icon-btn{background:transparent;border:0;color:inherit;font-size:20px;padding:6px 8px;border-radius:8px;cursor:pointer;line-height:1}
.icon-btn:active{background:rgba(255,255,255,.15)}
.lang-btn{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:8px;padding:4px 10px;font-size:14px;cursor:pointer}
main{padding:12px 12px 120px;max-width:720px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 14px;cursor:pointer;font-weight:500}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--hd);color:#fff;border-color:var(--hd)}
.btn.danger{color:var(--bad);border-color:#f0c4c4}
.btn.block{display:flex;width:100%}
.row{display:flex;gap:8px;align-items:center}
.row>*{flex:1;min-width:0}
.acts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:8px}
.acts .btn{padding:8px 4px;font-size:14px}
#savedList .t{overflow-wrap:anywhere}
.muted{color:var(--mut);font-size:13px}
.rep{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.rep input[type=checkbox]{width:22px;height:22px;margin-top:2px;flex:none}
.rep .t{font-weight:600}
.nums{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}
.nums div{background:#f6f8fb;border-radius:8px;padding:6px 8px;text-align:center}
.nums b{display:block;font-size:15px;direction:ltr}
.nums span{font-size:12px;color:var(--mut)}
.neg{color:var(--bad)}
.item{display:flex;gap:8px;padding:10px 4px;border-bottom:1px solid var(--line);cursor:pointer;align-items:center}
.item:last-child{border-bottom:0}
.item .n{width:26px;height:26px;border-radius:50%;background:#eef1f6;display:flex;align-items:center;justify-content:center;font-size:12px;flex:none}
.item .m{flex:1;min-width:0}
.item .m div{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .a{font-weight:600;direction:ltr}
.item.hl .m .d{background:#ffff00}
.flag{font-size:11px;padding:1px 6px;border-radius:6px;background:#fff3e0;color:var(--warn);margin-inline-start:4px}
.dock{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);padding:8px 8px calc(env(safe-area-inset-bottom) + 8px);display:grid;grid-template-columns:repeat(4,1fr);gap:6px;z-index:6}
.dock button{display:flex;flex-direction:column;align-items:center;gap:2px;border:0;background:#f3f5f8;border-radius:10px;padding:8px 2px;font-size:12px;cursor:pointer}
.dock button i{font-style:normal;font-size:20px}
.dock button.main{background:var(--hd);color:#fff}
.sheet{position:fixed;inset:0;background:var(--bg);z-index:20;overflow:auto}
.sheet main{padding-bottom:40px}
label.f{display:block;margin-bottom:10px}
label.f>span{display:flex;justify-content:space-between;gap:6px;font-size:13px;color:var(--mut);margin-bottom:4px}
label.f input,label.f select,label.f textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#fff;font-size:16px}
label.f textarea{min-height:64px;resize:vertical}
label.f.unsure input,label.f.unsure textarea{border-color:#f0a020;background:#fffaf0}
label.f.sure input{border-color:#9cd3a0;background:#f4fbf4}
.ar{font-size:12px;opacity:.85}
.tag{font-size:11px;border-radius:6px;padding:0 6px;font-style:normal}
.tag.ok{background:#e6f4e7;color:var(--ok)}.tag.warn{background:#fff3e0;color:var(--warn)}
input.num{direction:ltr}
[dir=rtl] input.num{text-align:right}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.chk{display:flex;align-items:center;gap:8px;padding:8px 0}
.chk input{width:22px;height:22px}
.status{padding:8px 12px;border-radius:10px;font-size:14px;margin-bottom:10px;background:#eef1f6}
.status.ok{background:#e6f4e7;color:var(--ok)}.status.warn{background:#fff3e0;color:var(--warn)}.status.bad{background:#fdecea;color:var(--bad)}
#scanner{position:fixed;inset:0;background:#000;z-index:30;display:flex;flex-direction:column}
#scanner video{flex:1;width:100%;object-fit:cover;min-height:0}
#scanner .frame{position:absolute;left:50%;top:45%;width:64vmin;height:64vmin;transform:translate(-50%,-50%);border:3px solid #39d353;border-radius:14px;box-shadow:0 0 0 2000px rgba(0,0,0,.35);pointer-events:none}
#scanner .bar{position:absolute;left:0;right:0;bottom:0;padding:12px 12px calc(env(safe-area-inset-bottom) + 14px);display:flex;gap:8px;flex-wrap:wrap;justify-content:center;background:linear-gradient(transparent,rgba(0,0,0,.7))}
#scanner .msg{position:absolute;top:calc(env(safe-area-inset-top) + 14px);left:12px;right:12px;text-align:center;color:#fff;background:rgba(0,0,0,.55);border-radius:10px;padding:8px}
#toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:10px;z-index:50;max-width:90vw;text-align:center;font-size:14px}
#busy{position:fixed;inset:0;background:rgba(255,255,255,.85);z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;font-weight:500;text-align:center;padding:20px}
.spin{width:38px;height:38px;border:4px solid #cfd6e2;border-top-color:var(--hd);border-radius:50%;animation:s 1s linear infinite}
.spin.sm{width:16px;height:16px;border-width:2px;display:inline-block;vertical-align:-3px;margin-inline-end:6px}
@keyframes s{to{transform:rotate(360deg)}}
#pdfPages img{width:100%;border:1px solid var(--line);margin-bottom:8px;background:#fff}
.empty{text-align:center;color:var(--mut);padding:30px 10px}
/* ---- report sheet rendered for the PDF (same layout and colours as the original) ---- */
#pdfHold{position:fixed;left:0;top:0;width:0;height:0;overflow:hidden}
#pdfStage{width:1000px;background:#fff}
.sheetx{width:1000px;background:#fff;padding:0 0 28px;direction:rtl;font-family:Calibri,Carlito,Arial,"Segoe UI",Tahoma,sans-serif;color:#000}
.sheetx table{width:100%;border-collapse:collapse;table-layout:fixed}
.sheetx td{border:1px solid #000;padding:3px 4px;font-size:12.5px;text-align:center;vertical-align:middle;line-height:1.35;word-wrap:break-word}
.sheetx .g td{background:#C6E0B4;height:14px;padding:0}
.sheetx .ti td{background:#D9D9D9;font-size:15px;font-weight:700;padding:5px}
.sheetx .hd td{background:#44546A;color:#fff;font-weight:700;padding:7px 3px}
.sheetx .cat td{background:#8EA9DB;font-weight:700}
.sheetx .tot td.lb{background:#9BC2E6;font-weight:700}
.sheetx .tot td.v{background:#8EA9DB}
.sheetx .ft td{font-weight:700}
.sheetx td.y{background:#FFFF00}
.sheetx td.num{direction:ltr}
</style>
</head>
<body>

<!-- Home: list of custody reports -->
<section id="home">
  <header class="top"><h1 data-i18n="homeTitle"></h1><button class="lang-btn" id="langBtn"></button><button class="icon-btn" id="menuBtn" data-i18n-aria="settings">⚙</button></header>
  <main>
    <div id="repList"></div>
    <button class="btn primary block" id="newRepBtn" data-i18n="newRep"></button>
    <p class="muted" style="margin-top:14px" data-i18n="homeHint"></p>
  </main>
  <div class="dock" style="grid-template-columns:1.4fr 1fr 1fr">
    <button id="homePdfBtn" class="main"><i>⎙</i><span data-i18n="homePdf"></span></button>
    <button id="savedBtn"><i>🗂</i><span data-i18n="savedFiles"></span></button>
    <button id="backupBtn"><i>⇩</i><span data-i18n="backup"></span></button>
  </div>
</section>

<!-- One custody report -->
<section id="report" class="hidden">
  <header class="top"><button class="icon-btn" id="backBtn" data-i18n="backArrow" data-i18n-aria="back"></button><h1 id="repTitle"></h1><button class="icon-btn" id="repEditBtn" data-i18n-aria="editCustody">✎</button></header>
  <main>
    <div class="card">
      <div class="nums">
        <div><span data-i18n="custody"></span><b id="sCustody"></b></div>
        <div><span data-i18n="spent"></span><b id="sSpent"></b></div>
        <div><span data-i18n="left"></span><b id="sLeft"></b></div>
      </div>
      <div class="muted" style="margin-top:8px" id="sCount"></div>
    </div>
    <div class="card" id="itemList"></div>
  </main>
  <div class="dock">
    <button id="scanBtn" class="main"><i>▣</i><span data-i18n="scanQr"></span></button>
    <button id="photoBtn"><i>📷</i><span data-i18n="photo"></span></button>
    <button id="manualBtn"><i>✎</i><span data-i18n="manual"></span></button>
    <button id="repPdfBtn"><i>⎙</i>PDF</button>
  </div>
  <input type="file" id="photoInput" accept="image/*,application/pdf,.pdf" multiple class="hidden">
</section>

<!-- Report settings -->
<section id="repSheet" class="sheet hidden">
  <header class="top"><button class="icon-btn" data-close data-i18n-aria="close">✕</button><h1 data-i18n="custodyDetails"></h1></header>
  <main>
    <label class="f"><span data-i18n="rTitle"></span><input id="rTitle" dir="rtl" placeholder="عهدة محمد نور .  ( مشروع مدارس المتقدمه  الجبيل - شركه مسماك )"></label>
    <label class="f"><span data-i18n="rCustody"></span><input id="rCustody" class="num" inputmode="decimal" placeholder="10000.00"></label>
    <label class="f"><span data-i18n="rCat"></span><input id="rCat" dir="rtl" placeholder="مستلزمات تشغيل"></label>
    <button class="btn primary block" id="rSave" data-i18n="save"></button>
    <div style="height:24px"></div>
    <button class="btn block" id="rUp" data-i18n="moveUp"></button>
    <div style="height:8px"></div>
    <button class="btn danger block" id="rDelete" data-i18n="deleteCustody"></button>
  </main>
</section>

<!-- Invoice form -->
<section id="formSheet" class="sheet hidden">
  <header class="top"><button class="icon-btn" data-close data-i18n-aria="close">✕</button><h1 id="fHead"></h1></header>
  <main dir="rtl">
    <div id="fStatus" class="status hidden"></div>
    <img id="fPreview" class="hidden" style="width:100%;max-height:220px;object-fit:contain;border-radius:10px;background:#fff;margin-bottom:10px" alt="">
    <label class="f" data-k="date"><span><b data-i18n="fDate"></b><em></em></span><input id="fDate" type="date"></label>
    <label class="f" data-k="invNo"><span><b data-i18n="fInvNo"></b><em></em></span><input id="fInvNo" class="num" inputmode="text" placeholder="0"></label>
    <label class="f" data-k="name"><span><b data-i18n="fName"></b><em></em></span><input id="fName" dir="auto"></label>
    <label class="f" data-k="desc"><span><b data-i18n="fDesc"></b><em></em></span><textarea id="fDesc" dir="auto"></textarea></label>
    <label class="f" data-k="vatNo"><span><b data-i18n="fVatNo"></b><em></em></span><input id="fVatNo" class="num" inputmode="numeric" placeholder="0"></label>
    <div class="grid2">
      <label class="f" data-k="after"><span><b data-i18n="fAfter"></b><em></em></span><input id="fAfter" class="num" inputmode="decimal"></label>
      <label class="f"><span><b data-i18n="fRate"></b></span><select id="fRate"><option value="15">15%</option><option value="0">0%</option></select></label>
      <label class="f" data-k="before"><span><b data-i18n="fBefore"></b><em></em></span><input id="fBefore" class="num" inputmode="decimal"></label>
      <label class="f" data-k="tax"><span><b data-i18n="fTax"></b><em></em></span><input id="fTax" class="num" inputmode="decimal"></label>
    </div>
    <div id="fCheck" class="muted" style="margin:-4px 0 8px"></div>
    <label class="chk"><input type="checkbox" id="fHl"> <span data-i18n="fHl"></span></label>
    <label class="f"><span><b data-i18n="fPos"></b></span><input id="fPos" type="number" inputmode="numeric" min="1" class="num"></label>
    <button class="btn primary block" id="fSave" data-i18n="save"></button>
    <div style="height:8px"></div>
    <button class="btn block" id="fSaveNext" data-i18n="saveNext"></button>
    <div style="height:20px"></div>
    <button class="btn danger block hidden" id="fDelete" data-i18n="deleteInvoice"></button>
    <details style="margin-top:14px" id="fOcrWrap" class="hidden"><summary class="muted" data-i18n="ocrText"></summary><pre id="fOcr" style="white-space:pre-wrap;font-size:12px;direction:ltr"></pre></details>
  </main>
</section>

<!-- Live QR camera -->
<section id="scanner" class="hidden">
  <video id="video" playsinline muted autoplay></video>
  <div class="frame"></div>
  <div class="msg" id="scanMsg"></div>
  <div class="bar">
    <button class="btn hidden" id="torchBtn">🔦 <span data-i18n="torch"></span></button>
    <button class="btn" id="scanPhotoBtn">📷 <span data-i18n="readPhoto"></span></button>
    <button class="btn" id="scanManualBtn">✎ <span data-i18n="noQr"></span></button>
    <button class="btn" id="scanClose">✕ <span data-i18n="close"></span></button>
  </div>
</section>

<!-- PDF result -->
<section id="pdfSheet" class="sheet hidden">
  <header class="top"><button class="icon-btn" data-close data-i18n-aria="close">✕</button><h1 data-i18n="pdfReady"></h1></header>
  <main>
    <p class="muted" data-i18n="savedNote"></p>
    <div class="row" style="margin-bottom:8px">
      <button class="btn primary" id="pdfShare" data-i18n="sharePdf"></button>
      <button class="btn primary" id="docxShare" data-i18n="shareWord"></button>
    </div>
    <div class="row" style="margin-bottom:10px">
      <button class="btn" id="pdfSave" data-i18n="savePdf"></button>
      <button class="btn" id="docxSave" data-i18n="saveWord"></button>
    </div>
    <div id="pdfPages"></div>
  </main>
</section>

<!-- Saved files -->
<section id="savedSheet" class="sheet hidden">
  <header class="top"><button class="icon-btn" data-close data-i18n-aria="close">✕</button><h1 data-i18n="savedFiles"></h1></header>
  <main><div id="savedList"></div></main>
</section>

<!-- Settings / backup -->
<section id="setSheet" class="sheet hidden">
  <header class="top"><button class="icon-btn" data-close data-i18n-aria="close">✕</button><h1 data-i18n="settingsTitle"></h1></header>
  <main>
    <div class="card">
      <b data-i18n="language"></b>
      <label class="f" style="margin-top:8px"><select id="langSel"><option value="en">English</option><option value="ar">العربية</option></select></label>
    </div>
    <div class="card">
      <b data-i18n="backup"></b>
      <p class="muted" data-i18n="backupHelp"></p>
      <button class="btn block" id="exportBtn" data-i18n="exportBtn"></button><div style="height:8px"></div>
      <button class="btn block" id="importBtn" data-i18n="importBtn"></button>
      <input type="file" id="importInput" accept=".json,application/json" class="hidden">
    </div>
    <div class="card">
      <b data-i18n="dateFmt"></b>
      <label class="f" style="margin-top:8px"><select id="dateFmt"><option value="d-m-yyyy">30-6-2026</option><option value="d/m/yyyy">30/6/2026</option><option value="dd/mm/yyyy">30/06/2026</option></select></label>
    </div>
    <p class="muted" id="verTxt"></p>
  </main>
</section>

<div id="pdfHold"><div id="pdfStage"></div></div>
<div id="toast" class="hidden"></div>
<div id="busy" class="hidden"><div class="spin"></div><div id="busyTxt"></div></div>

<script src="vendor/js/jsQR-1.4.0.js"></script>
<script src="vendor/js/zxing-0.21.3.min.js"></script>
<script src="vendor/qrwasm/zxing-reader-3.1.2.js"></script>
<script src="scan.js"></script>
<script src="i18n.js"></script>
<script src="docx.js"></script>
<script src="app.js"></script>
</body>
</html>
